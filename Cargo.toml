[package]
name = "confined"
version = "0.5.0"
authors = ["Dr Maxim Orlovsky <orlovsky@ubideco.org>"]
description = "Confined collections with compile-time size guarantees"
repository = "https://github.com/rust-amplify/confined"
homepage = "https://docs.rs/confined"
keywords = ["generics", "core", "collections", "patterns"]
categories = ["data-structures", "rust-patterns", "no-std"]
readme = "README.md"
license = "Apache-2.0"
edition = "2024"
rust-version = "1.100.0"
exclude = [".github"]

[lib]
name = "confined"

[[example]]
name = "cortex_m"
required-features = ["heapless"]

[dependencies]
amplify_num = { git = "https://github.com/rust-amplify/amplify-num", rev = "e359d07", default-features = false }
collections = { package = "collections-traits", version = "0.1.0", default-features = false }

ascii = { version = "1.1.0", default-features = false, optional = true }
indexmap = { version = "2.14.2", default-features = false, optional = true }

serde = { version = "1", default-features = false, features = ["derive"], optional = true }

[features]
default = ["std", "hex"]
all = ["std", "hex", "ascii-serde", "indexmap", "hashbrown", "heapless", "serde"]

alloc = ["collections/alloc", "amplify_num/alloc", "serde?/alloc"]
std = ["alloc", "collections/std", "ascii?/std", "indexmap?/std", "amplify_num/std", "serde?/std"]
hex = ["amplify_num/hex"]

ascii = ["alloc", "dep:ascii", "ascii/alloc", "collections/ascii"]
indexmap = ["alloc", "dep:indexmap", "collections/indexmap"]
hashbrown = ["alloc", "collections/hashbrown"]
heapless = ["collections/heapless"]

serde = ["dep:serde", "indexmap?/serde"]
ascii-serde = ["ascii", "serde", "std", "ascii/serde"]

[package.metadata.docs.rs]
features = ["all"]
