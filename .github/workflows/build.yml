name: Build

on:
  push:
    branches:
      - master
    tags:
      - 'v[0-9]+.*'
  pull_request:
    branches:
      - master
      - develop
      - 'v[0-9]+.*'

env:
  CARGO_TERM_COLOR: always

jobs:
  default:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check --workspace
      - name: All-feature tests and documentation examples
        run: cargo test --all-features
  no-alloc:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features:
          - ''
          - heapless
          - serde
          - hex
          - heapless,serde
          - heapless,hex
          - serde,hex
          - heapless,serde,hex
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check without allocation
        run: cargo check --workspace --lib --no-default-features --features "${{ matrix.features }}"
      - name: Test without allocation features
        run: cargo test --workspace --lib --tests --no-default-features --features "${{ matrix.features }}"
      - name: Reduced-feature documentation examples
        run: cargo test --doc --no-default-features --features "${{ matrix.features }}"
  features:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        feature: [ std, alloc, hex, ascii, indexmap, hashbrown, heapless, serde, ascii-serde ]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Feature ${{matrix.feature}}
        run: cargo test --workspace --no-default-features --features=${{matrix.feature}}
      - name: Feature ${{matrix.feature}}
        run: cargo check --workspace --features=${{matrix.feature}}
  cortex-m:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [ thumbv6m-none-eabi, thumbv7em-none-eabi ]
        features:
          - ''
          - heapless
          - heapless,serde,hex
          - alloc
          - alloc,hex,indexmap,hashbrown,serde
          - ascii,serde
          - alloc,hex,indexmap,hashbrown,ascii,serde
        # ASCII 1.1 unconditionally imports Arc; Cortex-M0 has no pointer atomics.
        exclude:
          - target: thumbv6m-none-eabi
            features: ascii,serde
          - target: thumbv6m-none-eabi
            features: alloc,hex,indexmap,hashbrown,ascii,serde
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Check bare-metal feature combination
        run: cargo check --lib --target ${{ matrix.target }} --no-default-features --features "${{ matrix.features }}"
      - name: Link allocator-free startup (not hardware execution)
        if: matrix.features == 'heapless'
        run: cargo rustc --example cortex_m --target ${{ matrix.target }} --no-default-features --features heapless -- -C panic=abort -C link-arg=-e_start
  platforms:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-24.04-arm, ubuntu-latest, macos-15-intel, macos-latest, windows-11-arm, windows-latest ]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Platform ${{matrix.os}}
        run: cargo check --workspace --all-features # we skip test targets here to be sure that the main library can be built
  toolchains:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: [ nightly, beta, stable, 1.100.0 ]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{matrix.toolchain}}
      - name: Toolchain ${{matrix.toolchain}}
        run: cargo +${{matrix.toolchain}} check --workspace --all-targets --all-features
